name: Cache GC

# Prunes the hestia cache: the default-branch scope grows forever otherwise.
# Runs must not overlap, so manual runs queue behind the nightly one.
concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      # REST cache deletes need actions:write.
      actions: write
      contents: read
    steps:
      - uses: DeterminateSystems/nix-installer-action@v23

      # Installs the released binary and exports its path as HESTIA_BIN along
      # with the cache API tokens GC needs; avoids building hestia from source.
      - uses: Mic92/hestia@v3

      - name: Run garbage collection
        run: |
          "$HESTIA_BIN" gc ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
