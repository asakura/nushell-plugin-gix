name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-flake-lock:
    if: github.repository_owner == 'asakura'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v29

        with:
          pr-title: "chore(flake): update flake.lock"

          pr-labels: |
            dependencies
            automated
