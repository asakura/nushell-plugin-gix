name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: nix develop -c cargo fmt --check

      - name: no stale markers
        run: |
          if grep -rn --include="*.rs" -E "TODO|FIXME|HACK|XXX" .; then
            echo "Stale markers found — resolve before merging" >&2
            exit 1
          fi

      - name: cargo clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc
        run: nix develop -c cargo doc --no-deps --workspace

        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: cargo test --workspace
        run: nix develop -c cargo test --workspace

      - name: cargo deny check
        run: nix develop -c cargo deny check
