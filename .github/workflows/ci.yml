name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Caches locally built store paths (the rust-overlay toolchain, the
      # git-hooks config) in the GitHub Actions cache, deduplicated across runs by hestia;
      # anything already on cache.nixos.org is fetched from there and never
      # re-cached (upstream-cache-filter).
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

        with:
          upstream-cache-filter: true

      # The toolchain comes from the flake, but rust-cache only sees the
      # runner's preinstalled rustc, so flake.lock is keyed in explicitly:
      # a toolchain bump must roll the key instead of restoring stale
      # artifacts as a "full match" and never saving fresh ones.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

        with:
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: nix develop -c cargo fmt --check

      - name: no stale markers
        run: |
          if grep -rn --include="*.rs" -E "TODO|FIXME|HACK|XXX" .; then
            echo "Stale markers found — resolve before merging" >&2
            exit 1
          fi

      - name: cargo clippy
        run: nix develop -c cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc
        run: nix develop -c cargo doc --no-deps --workspace

        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: cargo test --workspace
        run: nix develop -c cargo test --workspace

      - name: cargo deny check
        run: nix develop -c cargo deny check

  # Builds the static release binaries on every push to main so their store
  # paths (crane's dependency-only artifacts in particular) land in main's
  # the hestia cache. Release runs are scoped to their tag and can only read
  # caches written on the default branch, so without this every release
  # would rebuild the whole dependency tree twice from scratch.
  release-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package:
          - nu_plugin_gix-x86_64-linux-musl
          - nu_plugin_gix-aarch64-linux-musl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0

        with:
          upstream-cache-filter: true

      - name: nix build
        run: nix build ".#${{ matrix.package }}" -L
